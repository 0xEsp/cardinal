services:
  product-os:
    build: .
    ports:
      - "4400:4400"
    env_file: .env
    volumes:
      # Datos fuera del contenedor: sobreviven a rebuilds de la imagen.
      # - data/       → SQLite (cards + sesiones de agente)
      # - workspace/  → documentación de producto (.md, versionada en git)
      # - os/         → reglas editables
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./os:/app/os
      - ./.git:/app/.git
    restart: unless-stopped
